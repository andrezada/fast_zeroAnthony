[project]
name = "fast-zero"
version = "0.1.0"
description = "API REST para gerenciamento de usuários com autenticação JWT"
authors = [
    {name = "André",email = "andrelmrodriguess@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "aiosqlite (>=0.22.1,<0.23.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
]


[tool.poetry]
packages = [{ include = "fast_zero", from = "src" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "factory-boy (>=3.3.3,<4.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-random-order (>=1.2.0,<2.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "typos (>=1.50.2,<2.0.0)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ['src']
addopts = [
    '-p',
    'no:warnings',
    '--cov=fast_zero',
    '--cov-context=test',
    '--cov-branch',
    '--random-order',
]
asyncio_default_fixture_loop_scope = 'function'

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.taskipy.tasks]
lint = 'ruff check'
format = 'ruff check --fix && ruff format'
serve = 'fastapi dev src/fast_zero/app.py'
pre_tests = 'task lint'
tests = 'pytest -s -x -vv && coverage html --show-contexts'
